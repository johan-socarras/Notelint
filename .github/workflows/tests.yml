name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      # The installers download the repo. Point them at the commit under
      # test, not at whatever main holds today; a fork's PR names its own repo.
      NOTELINT_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      NOTELINT_BRANCH: ${{ github.head_ref || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.8 is the floor the README promises, and it is the one most likely
          # to break: ubuntu-latest no longer ships it, hence the pinned image.
          - { os: ubuntu-22.04, python: "3.8" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Tests
        run: python tests/test_notelint.py

      - name: The bundled example still reports its three planted faults
        shell: bash
        run: |
          # The step shell runs with -e, so capture the code instead of
          # letting the expected failure abort the step.
          rc=0
          python notelint.py example --report-only || rc=$?
          # 1 is the documented "there are findings" code, and the example
          # ships three on purpose. 0 would mean the checks stopped firing.
          test $rc -eq 1 || { echo "expected exit 1, got $rc"; exit 1; }

      - name: The installer runs the way a stock Windows runs it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Windows PowerShell 5.1 under ExecutionPolicy Restricted - what a
          # fresh Windows ships with - and through iex, the way the README
          # says. Expand-Archive used to die right here: its module is a
          # script, and Restricted refuses to load it. Also a base path with
          # a space, and a regression guard for the BOM: Set-Content -Encoding
          # UTF8 under 5.1 writes one, and the linter used to reject the very
          # note the installer had just written.
          $base = "$env:RUNNER_TEMP\kb with space"
          $cmd = "& ([scriptblock]::Create((Get-Content -Raw install.ps1))) -Base '$base' -Repo '$env:NOTELINT_REPO' -Branch '$env:NOTELINT_BRANCH'"
          powershell.exe -NoProfile -ExecutionPolicy Restricted -Command $cmd
          if ($LASTEXITCODE -ne 0) { throw "installer failed under ExecutionPolicy Restricted" }
          # It installed this commit, not whatever main holds today.
          if ((Get-FileHash notelint.py).Hash -ne (Get-FileHash "$base\tools\notelint.py").Hash) {
            throw "the installed notelint.py is not the one under test"
          }
          $seed = "$base\Example\notes\what-this-project-is.md"
          $b = [System.IO.File]::ReadAllBytes($seed)
          if ($b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) {
            throw "the seed note was written with a BOM"
          }
          # Re-running is promised to be safe: nothing of the user's is touched.
          Set-Content -Path "$base\mine.md" -Value "hand written"
          powershell.exe -NoProfile -ExecutionPolicy Restricted -Command $cmd
          if ($LASTEXITCODE -ne 0) { throw "the second run failed" }
          if ((Get-Content "$base\mine.md") -ne "hand written") { throw "the second run touched a user file" }

      - name: The installer runs end to end, twice
        if: runner.os != 'Windows'
        shell: bash
        run: |
          KB="$RUNNER_TEMP/kb with space"
          sh install.sh "$KB"
          for p in tools/notelint.py PROTOCOL.md SYNC.md templates/note.md tools/syncguard.py; do
            test -e "$KB/$p" || { echo "MISSING $p"; exit 1; }
          done
          # It installed this commit, not whatever main holds today.
          cmp notelint.py "$KB/tools/notelint.py"
          # Re-running is promised to be safe: nothing of the user's is touched.
          echo "hand written" > "$KB/mine.md"
          sh install.sh "$KB"
          test "$(cat "$KB/mine.md")" = "hand written"
